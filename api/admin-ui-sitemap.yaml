# Haravan Admin Live UI Sitemap (100% Live-DOM Verified on Haravan Admin)
# Base URL: https://{store_domain} (e.g. https://myshop.myharavan.com)
# Author: Nguyễn Ngọc Tuấn, Founder Transform Group

verified_environment:
  login_url: "https://accounts.haravan.com"
  admin_home: "/admin/dashboard/generals"
  quick_search_shortcut: "Ctrl+K"
  cross_origin_microfrontends:
    - { module: "Website", admin_prefix: "/admin/sale_channels/online_store/*", iframe_origin: "https://web.haravan.app" }
    - { module: "Khách hàng / CRM", admin_prefix: "/admin/customers*", iframe_origin: "https://customers.haravan.app" }
    - { module: "Báo cáo", admin_prefix: "/admin/reports/*", iframe_origin: "https://reports.haravan.app" }

sidebar_navigation:
  overview:
    label: "Tổng quan"
    path: "/admin/dashboard/generals"

  orders:
    label: "Đơn hàng"
    path: "/admin/orders"
    children:
      - { label: "Tất cả đơn hàng", path: "/admin/orders", render_mode: "native" }
      - { label: "Đơn hàng nháp", path: "/admin/draft_orders", render_mode: "native" }
      - { label: "Chưa hoàn tất", path: "/admin/orders/checkouts", render_mode: "native" }
      - { label: "Giao hàng hàng loạt", path: "/admin/orders/mass_fulfill", render_mode: "native" }

  shipments:
    label: "Vận chuyển"
    path: "/admin/shipments/dashboard"
    children:
      - { label: "Tổng quan", path: "/admin/shipments/dashboard", render_mode: "native" }
      - { label: "Vận chuyển", path: "/admin/shipments", render_mode: "native" }
      - { label: "Quản lý thu hộ", path: "/admin/shipments/managecod", render_mode: "native" }
      - { label: "Đóng gói", path: "/admin/shipments/packed", render_mode: "native" }
      - { label: "Biên bản bàn giao", path: "/admin/shipments/shipment_handovers", render_mode: "native" }
      - { label: "Biên bản hoàn hàng", path: "/admin/shipments/shipment_returns", render_mode: "native" }

  products:
    label: "Sản phẩm"
    path: "/admin/products"
    children:
      - { label: "Tất cả sản phẩm", path: "/admin/products", render_mode: "native" }
      - { label: "Nhóm sản phẩm", path: "/admin/products/collections", render_mode: "native" }
      - { label: "Bảng giá", path: "/admin/products/pricing_list", render_mode: "native" }
      - { label: "Tồn kho", path: "/admin/products/inventories", render_mode: "native" }

  customers:
    label: "Khách hàng"
    path: "/admin/customers"
    iframe_origin: "https://customers.haravan.app"
    children:
      - { label: "Tất cả khách hàng", path: "/admin/customers", render_mode: "cross_origin_iframe" }
      - { label: "Nhóm khách hàng", path: "/admin/customers/segments", render_mode: "cross_origin_iframe" }
      - { label: "Chiến dịch Broadcast", path: "/admin/customers/broadcast_campaigns", render_mode: "cross_origin_iframe" }
      - { label: "Kịch bản tự động", path: "/admin/customers/flows", render_mode: "cross_origin_iframe" }
      - { label: "Quản lý đánh giá", path: "/admin/customers/rating", render_mode: "cross_origin_iframe" }
      - { label: "Cấu hình thành viên", path: "/admin/customers/settings", render_mode: "cross_origin_iframe" }

  accounting:
    label: "Sổ quỹ"
    path: "/admin/accounting/transactions"
    children:
      - { label: "Sổ quỹ", path: "/admin/accounting/transactions", render_mode: "native" }
      - { label: "Công nợ", path: "/admin/accounting/debts", render_mode: "native" }

  discounts:
    label: "Khuyến mãi"
    path: "/admin/discounts"
    render_mode: "native"

  reports:
    label: "Báo cáo"
    path: "/admin/reports/dashboard"
    iframe_origin: "https://reports.haravan.app"
    children:
      - { label: "Bảng phân tích", path: "/admin/reports/dashboard", render_mode: "cross_origin_iframe" }
      - { label: "Danh sách báo cáo", path: "/admin/reports/listing", render_mode: "cross_origin_iframe" }

  etax:
    label: "Thuế & kế toán"
    path: "/admin/etax/declarations"
    children:
      - { label: "Tờ khai thuế", path: "/admin/etax/declarations", render_mode: "native" }
      - { label: "Sổ kế toán", path: "/admin/etax/revenue_ledgers", render_mode: "native" }

  marketing:
    label: "Marketing"
    path: "/admin/settings/marketing_channels"
    children:
      - { label: "TikTok Ads", path: "/admin/marketings/tiktok_ads/products" }
      - { label: "Google Ads", path: "/admin/googleshop" }

  sale_channels:
    label: "Kênh bán hàng"
    path: "/admin/settings/sale_channels"
    website_iframe_origin: "https://web.haravan.app"
    website_children:
      - { label: "Giao diện", path: "/admin/sale_channels/online_store/themes", render_mode: "cross_origin_iframe" }
      - { label: "Blogs", path: "/admin/sale_channels/online_store/articles", render_mode: "cross_origin_iframe" }
      - { label: "Trang nội dung", path: "/admin/sale_channels/online_store/pages", render_mode: "cross_origin_iframe" }
      - { label: "Menu", path: "/admin/sale_channels/online_store/menus", render_mode: "cross_origin_iframe" }
      - { label: "Cấu hình Website", path: "/admin/sale_channels/online_store/settings", render_mode: "cross_origin_iframe" }
    external_apps:
      - { label: "Haravan POS", url: "https://pos.haravan.app" }
      - { label: "Harasocial", url: "https://app.harasocial.com" }

  apps:
    label: "Ứng dụng"
    path: "/admin/apps"
    render_mode: "native"

settings_hub:
  path: "/admin/settings"
  total_items: 17
  items:
    - { key: "general", label: "Cấu hình chung", path: "/admin/settings/general" }
    - { key: "accounts", label: "Nhân viên", path: "/admin/settings/accounts" }
    - { key: "group_permissions", label: "Vai trò", path: "/admin/settings/group_permissions" }
    - { key: "group_accounts", label: "Nhóm phân công", path: "/admin/settings/group_accounts" }
    - { key: "locations", label: "Địa chỉ và kho hàng", path: "/admin/settings/locations" }
    - { key: "shipments", label: "Vận chuyển", path: "/admin/settings/shipments" }
    - { key: "payments", label: "Phương thức thanh toán", path: "/admin/settings/payments" }
    - { key: "checkouts", label: "Thanh toán", path: "/admin/settings/checkouts" }
    - { key: "sale_channels", label: "Kênh bán hàng", path: "/admin/settings/sale_channels" }
    - { key: "marketing_channels", label: "Kênh marketing", path: "/admin/settings/marketing_channels" }
    - { key: "files", label: "Quản lý file", path: "/admin/settings/files" }
    - { key: "notifications", label: "Thông báo", path: "/admin/settings/notifications" }
    - { key: "billings", label: "Billing", path: "/admin/settings/billings" }
    - { key: "vat_setting", label: "Thuế & hóa đơn điện tử", path: "/admin/settings/vat_setting" }
    - { key: "domains", label: "Tên miền", path: "/admin/settings/domains" }
    - { key: "order_addon", label: "Tiện ích đơn hàng", path: "/admin/settings/order_addon" }
    - { key: "policies", label: "Điều khoản & Chính sách", path: "/admin/settings/policies" }

